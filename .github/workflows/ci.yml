name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The contract cannot drift from the types (#3): this fails if
      # schema/atlas.schema.json is stale relative to src/schema/types.ts.
      - run: npm run schema:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
